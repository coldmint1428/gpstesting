apply plugin: 'com.android.application'

android {
    namespace = "sg.edu.smu.is216.g11"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "sg.edu.smu.is216.g11"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // ReminderMessagingService.java draws push reminders with a "Start sharing" button
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// The web app inside the APK is a COPY (src/main/assets/public, git-ignored), refreshed only by `npm run build` and
// `npx cap copy`. Building from Android Studio after a pull therefore packaged whatever copy was last made: on 2 Nov
// that was 31 Oct's, without SOS or attendance. So every build now refreshes it first: install packages (new ones
// arrive with a pull, e.g. jsqr), build the web app, copy it in. `cap copy`, not `cap sync`: sync rewrites Gradle files
// while Gradle is running. Skip with -PskipWebBuild (e.g. when only native code changed and node is not available).
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def webRoot = rootProject.file('..')
def shell = { List<String> args -> isWindows ? ['cmd', '/c'] + args : args }
tasks.register('webInstall', Exec) {
    group = 'web app'
    description = 'npm install in the web project (fast when nothing changed)'
    workingDir webRoot
    commandLine shell(['npm', 'install', '--no-audit', '--no-fund'])
}
tasks.register('webBuild', Exec) {
    group = 'web app'
    description = 'npm run build: the web app into dist/'
    dependsOn 'webInstall'
    workingDir webRoot
    commandLine shell(['npm', 'run', 'build'])
}
tasks.register('webCopy', Exec) {
    group = 'web app'
    description = 'npx cap copy android: dist/ into the APK assets'
    dependsOn 'webBuild'
    workingDir webRoot
    commandLine shell(['npx', 'cap', 'copy', 'android'])
}
if (!project.hasProperty('skipWebBuild')) {
    preBuild.dependsOn 'webCopy'
}

// Firebase config (gitignored, so a branch switch or fresh clone can lose it). Without it the app
// crashes on start ("Default FirebaseApp is not initialized" when push registers), so stop the build.
def servicesJSON = file('google-services.json')
if (!servicesJSON.exists() || !servicesJSON.text.trim()) {
    throw new GradleException("android/app/google-services.json is missing. Download it from Firebase " +
        "(project wad2-project-26093, app sg.edu.smu.is216.g11) and put it in android/app/. Without it the app crashes on start.")
}
apply plugin: 'com.google.gms.google-services'
